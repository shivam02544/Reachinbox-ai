version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-reachinbox_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reachinbox_pass}
      POSTGRES_DB: reachinbox_greenfield
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachinbox_user -d reachinbox_greenfield"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: reachinbox-greenfield-backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://reachinbox_user:reachinbox_pass@postgres:5432/reachinbox_greenfield
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=reachinbox_dev_secret_12345
      - JWT_ACCESS_EXPIRES_IN=15m
      - REFRESH_TOKEN_EXPIRES_DAYS=7
      - BCRYPT_ROUNDS=12
      - ENCRYPTION_KEY=reachinbox_super_secret_encryption_key_32_chars
      - ALLOWED_ORIGINS=http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: reachinbox-greenfield-worker
    command: npm run worker
    restart: always
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://reachinbox_user:reachinbox_pass@postgres:5432/reachinbox_greenfield
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=reachinbox_dev_secret_12345
      - ENCRYPTION_KEY=reachinbox_super_secret_encryption_key_32_chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
